name: keepalive

on:
  schedule:
    - cron: "*/14 13-23 * * *"
    - cron: "*/14 0-1 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend
        run: curl -sS -m 120 https://githunter.onrender.com/api/health || true

      - name: Keep Supabase awake
        run: |
          curl -sS -m 30 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/archived_reports?select=username&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" || true
